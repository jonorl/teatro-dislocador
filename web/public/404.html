<!DOCTYPE html>
<!-- Its presence also stops Cloudflare Pages answering unknown URLs with the home page and a 200. -->
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Página no encontrada | Teatro Dislocador</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1a1a; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
      h1 { font-size: 2rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.5rem; }
      p { color: #d1d5db; margin: 0 0 2rem; }
      a { display: inline-block; padding: 0.75rem 2rem; border: 2px solid #fff; color: #fff; text-decoration: none; text-transform: uppercase; font-weight: 800; letter-spacing: 0.15em; font-size: 0.75rem; }
      a:hover { background: #e64a3b; border-color: #e64a3b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Página no encontrada</h1>
      <p>La página que buscás no existe o se movió.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
