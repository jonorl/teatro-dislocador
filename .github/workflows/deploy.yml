name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**' #UPDATE
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:


jobs:
  # Runs the same suites as the Test workflow, so a red build never reaches the VPS.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./server/ # UPDATE
          push: true
          tags: ghcr.io/jonorl/teatro-dislocador:latest # UPDATE
          no-cache: true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Deploy to VPS
        # Pinned to a commit because this third-party action receives the VPS SSH key, and tags can be moved.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: | #update
            # 1. Force a pull of the latest image directly via Docker
            docker pull ghcr.io/jonorl/teatro-dislocador:latest
            
            # 2. Re-create the container using the newly pulled image
            docker compose -f ~/server/backend/docker-compose.yml up -d --force-recreate teatro-dislocador
            
            # 3. Optional: Clean up old dangling images to save disk space
            docker image prune -f
      # A green deploy only means the container was recreated; this checks the API actually serves through
      # Cloudflare, reads the database and still enforces auth. Retries while the container starts.
      - name: Smoke test
        env:
          API: https://api.teatrodislocador.ar/api
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "$API/classes" | jq -e '.classes | type == "array"' > /dev/null; then
              echo "API answering after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::GET /api/classes did not return a classes list within a minute"
              exit 1
            fi
            sleep 5
          done

          for endpoint in showcase gallery; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$API/$endpoint")
            [ "$status" = 200 ] || { echo "::error::GET /api/$endpoint returned $status"; exit 1; }
          done

          # 401 proves NODE_ENV isn't 'development', which would switch admin auth off.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST "$API/showcase")
          [ "$status" = 401 ] || { echo "::error::Unauthenticated POST /api/showcase returned $status, expected 401"; exit 1; }

          echo "Smoke test passed"
