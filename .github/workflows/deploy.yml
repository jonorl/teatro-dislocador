name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**' #UPDATE
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:


jobs:
  # Runs the same suites as the Test workflow, so a red build never reaches the VPS.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./server/ # UPDATE
          push: true
          tags: ghcr.io/jonorl/teatro-dislocador:latest # UPDATE
          no-cache: true
          build-args: GIT_SHA=${{ github.sha }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Deploy to VPS
        # Pinned to a commit because this third-party action receives the VPS SSH key, and tags can be moved.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: | #update
            # 1. Force a pull of the latest image directly via Docker
            docker pull ghcr.io/jonorl/teatro-dislocador:latest
            
            # 2. Re-create the container using the newly pulled image
            docker compose -f ~/server/backend/docker-compose.yml up -d --force-recreate teatro-dislocador
            
            # 3. Optional: Clean up old dangling images to save disk space
            docker image prune -f
      # A green deploy only means the container was recreated. This waits until /health reports this commit, so the
      # new container (not the old one) is answering through Cloudflare with a working database, then checks the
      # public endpoints and that admin routes still require a login.
      - name: Smoke test
        env:
          BASE: https://api.teatrodislocador.ar
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 18); do
            health=$(curl -s --max-time 10 "$BASE/health" || true)
            if echo "$health" | jq -e --arg v "$EXPECTED_VERSION" '.status == "ok" and .version == $v' > /dev/null 2>&1; then
              echo "New version healthy after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::/health did not report status ok for $EXPECTED_VERSION within 90 seconds. Last response: $health"
              exit 1
            fi
            sleep 5
          done

          curl -fsS --max-time 10 "$BASE/api/classes" | jq -e '.classes | type == "array"' > /dev/null \
            || { echo "::error::GET /api/classes did not return a classes list"; exit 1; }
          for endpoint in showcase gallery; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE/api/$endpoint")
            [ "$status" = 200 ] || { echo "::error::GET /api/$endpoint returned $status"; exit 1; }
          done

          # 401 proves NODE_ENV isn't 'development', which would switch admin auth off.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST "$BASE/api/showcase")
          [ "$status" = 401 ] || { echo "::error::Unauthenticated POST /api/showcase returned $status, expected 401"; exit 1; }

          echo "Smoke test passed"
